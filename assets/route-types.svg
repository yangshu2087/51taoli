<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="620" viewBox="0 0 1680 620" role="img" aria-labelledby="title desc">
  <title id="title">51taoli 七类路线</title>
  <desc id="desc">第一位字母表示做多腿，第二位字母表示做空腿。S 是加密现货，F 是衍生品，T 是 TradFi 或 RWA 产品。</desc>
  <rect width="1680" height="620" rx="32" fill="#f5f7fa"/>
  <text x="72" y="78" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#111827">七类路线：第一位做多，第二位做空</text>
  <text x="72" y="125" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#667085">S = 加密现货　F = 衍生品　T = TradFi / RWA</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(72 176)">
      <rect width="360" height="158" rx="22" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#111827">FF</text>
      <text x="28" y="96" font-size="24" fill="#344054">衍生品多 → 衍生品空</text>
      <text x="28" y="130" font-size="20" fill="#667085">跨衍生品市场</text>
    </g>
    <g transform="translate(456 176)">
      <rect width="360" height="158" rx="22" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#111827">SF</text>
      <text x="28" y="96" font-size="24" fill="#344054">现货多 → 衍生品空</text>
      <text x="28" y="130" font-size="20" fill="#667085">正向期现 / 跨所基差</text>
    </g>
    <g transform="translate(840 176)">
      <rect width="360" height="158" rx="22" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#111827">FS</text>
      <text x="28" y="96" font-size="24" fill="#344054">衍生品多 → 现货空</text>
      <text x="28" y="130" font-size="20" fill="#667085">反向期现，需核对借贷</text>
    </g>
    <g transform="translate(1224 176)">
      <rect width="384" height="158" rx="22" fill="#ffffff" stroke="#d0d5dd"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#111827">SS</text>
      <text x="28" y="96" font-size="24" fill="#344054">现货多 → 现货空</text>
      <text x="28" y="130" font-size="20" fill="#667085">跨现货市场</text>
    </g>

    <g transform="translate(264 366)">
      <rect width="360" height="158" rx="22" fill="#ecfdf3" stroke="#6ce9a6"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#067647">TF</text>
      <text x="28" y="96" font-size="24" fill="#344054">TradFi 多 → 衍生品空</text>
      <text x="28" y="130" font-size="20" fill="#667085">跨传统与加密市场</text>
    </g>
    <g transform="translate(648 366)">
      <rect width="360" height="158" rx="22" fill="#ecfdf3" stroke="#6ce9a6"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#067647">FT</text>
      <text x="28" y="96" font-size="24" fill="#344054">衍生品多 → TradFi 空</text>
      <text x="28" y="130" font-size="20" fill="#667085">方向相反的跨市场路线</text>
    </g>
    <g transform="translate(1032 366)">
      <rect width="384" height="158" rx="22" fill="#ecfdf3" stroke="#6ce9a6"/>
      <text x="28" y="55" font-size="34" font-weight="700" fill="#067647">TT</text>
      <text x="28" y="96" font-size="24" fill="#344054">TradFi 多 → TradFi 空</text>
      <text x="28" y="130" font-size="20" fill="#667085">跨 TradFi / RWA 市场</text>
    </g>
  </g>
</svg>
