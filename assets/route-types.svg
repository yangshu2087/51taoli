<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">FF、SF、FS 三种路线类型</title>
  <desc id="desc">三种方向性市场路线都使用真实买一卖一作为理论观察基础，其中 FS 还要关注现货空腿借币条件。</desc>
  <rect width="1240" height="500" rx="28" fill="#f2f4f5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="75" fill="#111318" font-size="34" font-weight="700">三种路线类型：FF、SF、FS</text>
    <text x="64" y="110" fill="#6f7782" font-size="18">路线是市场结构分类；策略是独立、带版本的筛选与通知规则。</text>
    <g transform="translate(64 160)">
      <g><rect width="340" height="236" rx="20" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="28" y="42" fill="#2864dc" font-size="26" font-weight="700">FF · 期–期</text><text x="28" y="75" fill="#424850" font-size="16">永续 × 永续的跨所方向性观察</text><rect x="28" y="112" width="108" height="54" rx="10" fill="#15171c"/><text x="82" y="145" text-anchor="middle" fill="#fff" font-size="16">永续 · 多</text><path d="M148 139h42" stroke="#a8b1bc" stroke-width="3"/><path d="M179 128l12 11-12 11" fill="none" stroke="#a8b1bc" stroke-width="3"/><rect x="202" y="112" width="108" height="54" rx="10" fill="#15171c"/><text x="256" y="145" text-anchor="middle" fill="#fff" font-size="16">永续 · 空</text><text x="28" y="205" fill="#6f7782" font-size="14">核对身份、方向 BBO、资金费与退出成本。</text></g>
      <g transform="translate(386)"><rect width="340" height="236" rx="20" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="28" y="42" fill="#2864dc" font-size="26" font-weight="700">SF · 现–期</text><text x="28" y="75" fill="#424850" font-size="16">现货多 × 永续空的方向性观察</text><rect x="28" y="112" width="108" height="54" rx="10" fill="#00a884"/><text x="82" y="145" text-anchor="middle" fill="#fff" font-size="16">现货 · 多</text><path d="M148 139h42" stroke="#a8b1bc" stroke-width="3"/><path d="M179 128l12 11-12 11" fill="none" stroke="#a8b1bc" stroke-width="3"/><rect x="202" y="112" width="108" height="54" rx="10" fill="#15171c"/><text x="256" y="145" text-anchor="middle" fill="#fff" font-size="16">永续 · 空</text><text x="28" y="205" fill="#6f7782" font-size="14">标记价不是入场价；使用真实 ask / bid。</text></g>
      <g transform="translate(772)"><rect width="340" height="236" rx="20" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="28" y="42" fill="#2864dc" font-size="26" font-weight="700">FS · 期–现</text><text x="28" y="75" fill="#424850" font-size="16">永续多 × 现货空的方向性观察</text><rect x="28" y="112" width="108" height="54" rx="10" fill="#15171c"/><text x="82" y="145" text-anchor="middle" fill="#fff" font-size="16">永续 · 多</text><path d="M148 139h42" stroke="#a8b1bc" stroke-width="3"/><path d="M179 128l12 11-12 11" fill="none" stroke="#a8b1bc" stroke-width="3"/><rect x="202" y="112" width="108" height="54" rx="10" fill="#df4f5f"/><text x="256" y="145" text-anchor="middle" fill="#fff" font-size="16">现货 · 空</text><text x="28" y="205" fill="#6f7782" font-size="14">还需借币利率、额度与适用范围等事实。</text></g>
    </g>
    <rect x="64" y="430" width="1048" height="38" rx="10" fill="#e7ebef"/><text x="84" y="455" fill="#424850" font-size="15">图示说明路线结构；页面中的开差是理论 BBO 观察，不表示实际下单、可成交容量或净收益。</text>
  </g>
</svg>
