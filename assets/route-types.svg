<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" role="img" aria-labelledby="title desc">
  <title id="title">FF、SF、FS 三种路线类型</title>
  <desc id="desc">FF 为期货对期货，SF 为现货多期货空，FS 为期货多现货空。</desc>
  <rect width="1240" height="470" rx="28" fill="#f6f7f9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="74" fill="#17191d" font-size="34" font-weight="700">三种路线类型：FF、SF、FS</text>
    <text x="64" y="110" fill="#667085" font-size="18">先看市场组合，再看每条腿的方向。</text>
    <g transform="translate(64 160)">
      <g><rect width="340" height="218" rx="20" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="28" y="45" fill="#1f6feb" font-size="27" font-weight="700">FF · 期–期</text><text x="28" y="78" fill="#4b5563" font-size="16">合约 / 永续与合约 / 永续</text><rect x="28" y="112" width="112" height="54" rx="11" fill="#17191d"/><text x="84" y="145" text-anchor="middle" fill="#fff" font-size="17">期货 · 多</text><path d="M151 139h40" stroke="#a9b3be" stroke-width="3"/><path d="M180 128l12 11-12 11" fill="none" stroke="#a9b3be" stroke-width="3"/><rect x="202" y="112" width="112" height="54" rx="11" fill="#17191d"/><text x="258" y="145" text-anchor="middle" fill="#fff" font-size="17">期货 · 空</text><text x="28" y="198" fill="#667085" font-size="15">适合比较两个合约市场</text></g>
      <g transform="translate(386)"><rect width="340" height="218" rx="20" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="28" y="45" fill="#1f6feb" font-size="27" font-weight="700">SF · 现–期</text><text x="28" y="78" fill="#4b5563" font-size="16">现货多与合约 / 永续空</text><rect x="28" y="112" width="112" height="54" rx="11" fill="#00a884"/><text x="84" y="145" text-anchor="middle" fill="#fff" font-size="17">现货 · 多</text><path d="M151 139h40" stroke="#a9b3be" stroke-width="3"/><path d="M180 128l12 11-12 11" fill="none" stroke="#a9b3be" stroke-width="3"/><rect x="202" y="112" width="112" height="54" rx="11" fill="#17191d"/><text x="258" y="145" text-anchor="middle" fill="#fff" font-size="17">期货 · 空</text><text x="28" y="198" fill="#667085" font-size="15">适合比较现货和合约</text></g>
      <g transform="translate(772)"><rect width="340" height="218" rx="20" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="28" y="45" fill="#1f6feb" font-size="27" font-weight="700">FS · 期–现</text><text x="28" y="78" fill="#4b5563" font-size="16">合约 / 永续多与现货空</text><rect x="28" y="112" width="112" height="54" rx="11" fill="#17191d"/><text x="84" y="145" text-anchor="middle" fill="#fff" font-size="17">期货 · 多</text><path d="M151 139h40" stroke="#a9b3be" stroke-width="3"/><path d="M180 128l12 11-12 11" fill="none" stroke="#a9b3be" stroke-width="3"/><rect x="202" y="112" width="112" height="54" rx="11" fill="#d94e5d"/><text x="258" y="145" text-anchor="middle" fill="#fff" font-size="17">现货 · 空</text><text x="28" y="198" fill="#667085" font-size="15">适合进一步查看借贷条件</text></g>
    </g>
  </g>
</svg>
