<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="520" viewBox="0 0 1680 520" role="img" aria-labelledby="title desc">
  <title id="title">从理论价差到风险调整净边际</title>
  <desc id="desc">先读方向正确的理论价差，再核对深度费用和滑点得到可执行价差，最后考虑资金费、借贷、退出、身份与市场变化。</desc>
  <rect width="1680" height="520" rx="32" fill="#0f172a"/>
  <text x="72" y="82" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="700" fill="#ffffff">一个正数，需要经过三层检查</text>
  <text x="72" y="128" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" fill="#cbd5e1">不要把页面上的理论价差直接当成收益</text>

  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(72 184)">
      <rect width="430" height="252" rx="24" fill="#ffffff"/>
      <text x="30" y="50" font-size="20" font-weight="700" fill="#10b981">01　先看方向</text>
      <text x="30" y="98" font-size="32" font-weight="700" fill="#111827">理论价差</text>
      <text x="30" y="143" font-size="22" fill="#475467">做多腿 ask</text>
      <text x="30" y="178" font-size="22" fill="#475467">做空腿 bid</text>
      <text x="30" y="220" font-size="20" fill="#667085">回答：两条腿相距多远？</text>
    </g>
    <text x="525" y="325" font-size="48" fill="#94a3b8">→</text>
    <g transform="translate(580 184)">
      <rect width="430" height="252" rx="24" fill="#ffffff"/>
      <text x="30" y="50" font-size="20" font-weight="700" fill="#10b981">02　再看成交</text>
      <text x="30" y="98" font-size="32" font-weight="700" fill="#111827">可执行价差</text>
      <text x="30" y="143" font-size="22" fill="#475467">金额 · 深度 · 滑点</text>
      <text x="30" y="178" font-size="22" fill="#475467">交易费 · 可用市场</text>
      <text x="30" y="220" font-size="20" fill="#667085">回答：按你的条件能否成交？</text>
    </g>
    <text x="1033" y="325" font-size="48" fill="#94a3b8">→</text>
    <g transform="translate(1088 184)">
      <rect width="520" height="252" rx="24" fill="#ecfdf3" stroke="#6ce9a6"/>
      <text x="30" y="50" font-size="20" font-weight="700" fill="#067647">03　最后看完整条件</text>
      <text x="30" y="98" font-size="32" font-weight="700" fill="#111827">风险调整净边际</text>
      <text x="30" y="143" font-size="22" fill="#475467">资金费 · 借贷 · 充提 · 退出</text>
      <text x="30" y="178" font-size="22" fill="#475467">身份 · 时间 · 单位 · 市场变化</text>
      <text x="30" y="220" font-size="20" fill="#667085">回答：证据是否足以继续研究？</text>
    </g>
  </g>
</svg>
