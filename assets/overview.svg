<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" role="img" aria-labelledby="title desc">
  <title id="title">51taoli 从市场事实到研究结论的产品结构</title>
  <desc id="desc">官方市场来源经过事实校验，形成只读路线观察与研究工具；缺少关键证据时显示暂无。</desc>
  <rect width="1240" height="520" rx="28" fill="#f2f4f5"/>
  <text x="64" y="75" fill="#111318" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="700">从市场事实，到可追溯的研究观察</text>
  <text x="64" y="110" fill="#6f7782" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18">51taoli 只读展示经过来源、时间、方向与身份边界约束的数据。</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(64 165)">
      <rect width="244" height="210" rx="18" fill="#ffffff" stroke="#dde1e4" stroke-width="2"/>
      <circle cx="34" cy="38" r="17" fill="#2864dc"/><path d="M26 38h16M34 30v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="45" fill="#111318" font-size="23" font-weight="700">官方市场事实</text>
      <text x="30" y="94" fill="#424850" font-size="17">行情买一 / 卖一</text><text x="30" y="125" fill="#424850" font-size="17">资金费 / 指数 / 产品目录</text><text x="30" y="156" fill="#424850" font-size="17">公告 / 冲提 / 借贷</text>
      <rect x="30" y="174" width="152" height="22" rx="11" fill="#edf3ff"/><text x="42" y="191" fill="#2864dc" font-size="13" font-weight="600">来源按数据族独立</text>
    </g>
    <path d="M325 270h55" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round"/><path d="M367 258l14 12-14 12" fill="none" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(398 165)">
      <rect width="244" height="210" rx="18" fill="#ffffff" stroke="#dde1e4" stroke-width="2"/>
      <circle cx="34" cy="38" r="17" fill="#15171c"/><path d="M26 39l6 6 11-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="64" y="45" fill="#111318" font-size="23" font-weight="700">事实校验</text>
      <text x="30" y="94" fill="#424850" font-size="17">资产身份不靠 ticker 猜测</text><text x="30" y="125" fill="#424850" font-size="17">入场方向使用真实 BBO</text><text x="30" y="156" fill="#424850" font-size="17">字段保留各自来源时间</text>
      <rect x="30" y="174" width="160" height="22" rx="11" fill="#eef8f5"/><text x="42" y="191" fill="#07966c" font-size="13" font-weight="600">不把未知写成结论</text>
    </g>
    <path d="M659 270h55" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round"/><path d="M701 258l14 12-14 12" fill="none" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(732 165)">
      <rect width="244" height="210" rx="18" fill="#ffffff" stroke="#dde1e4" stroke-width="2"/>
      <circle cx="34" cy="38" r="17" fill="#00a884"/><path d="M27 38h14M34 31v14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      <text x="64" y="45" fill="#111318" font-size="23" font-weight="700">只读路线观察</text>
      <text x="30" y="94" fill="#424850" font-size="17">FF · SF · FS</text><text x="30" y="125" fill="#424850" font-size="17">加密货币与 TradFi</text><text x="30" y="156" fill="#424850" font-size="17">理论开差与清差分层</text>
      <rect x="30" y="174" width="176" height="22" rx="11" fill="#fff7e6"/><text x="42" y="191" fill="#a46b0b" font-size="13" font-weight="600">不等同于可执行收益</text>
    </g>
    <path d="M993 270h55" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round"/><path d="M1035 258l14 12-14 12" fill="none" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(1066 165)">
      <rect width="110" height="210" rx="18" fill="#15171c"/>
      <text x="55" y="46" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">研究</text>
      <text x="55" y="93" text-anchor="middle" fill="#dce3ed" font-size="15">详情</text><text x="55" y="123" text-anchor="middle" fill="#dce3ed" font-size="15">曲线</text><text x="55" y="153" text-anchor="middle" fill="#dce3ed" font-size="15">策略</text><text x="55" y="183" text-anchor="middle" fill="#dce3ed" font-size="15">FAQ</text>
    </g>
  </g>
  <rect x="64" y="416" width="1112" height="48" rx="12" fill="#e7ebef"/>
  <text x="88" y="447" fill="#424850" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="16">关键证据缺失 → 显示「暂无 / 未知」；本图为产品结构说明，不是实时行情或收益承诺。</text>
</svg>
