      <rect x="908" y="24" width="172" height="46" rx="23" fill="#1f6feb"/><text x="994" y="54" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">/opportunities</text>
      <path d="M556 110v36" stroke="#a9b3be" stroke-width="3"/><path d="M544 134l12 12 12-12" fill="none" stroke="#a9b3be" stroke-width="3"/>
      <g transform="translate(0 168)">
        <g><rect width="260" height="126" rx="17" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="25" y="39" fill="#17191d" font-size="21" font-weight="700">交易</text><text x="25" y="72" fill="#4b5563" font-size="16">资产、类别、路线筛选</text><text x="25" y="101" fill="#1f6feb" font-size="14">/trade</text></g>
        <g transform="translate(284)"><rect width="260" height="126" rx="17" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="25" y="39" fill="#17191d" font-size="21" font-weight="700">资金费</text><text x="25" y="72" fill="#4b5563" font-size="16">费率、周期、已结算记录</text><text x="25" y="101" fill="#1f6feb" font-size="14">Funding</text></g>
        <g transform="translate(568)"><rect width="260" height="126" rx="17" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="25" y="39" fill="#17191d" font-size="21" font-weight="700">指数</text><text x="25" y="72" fill="#4b5563" font-size="16">指数价、标记价、比较</text><text x="25" y="101" fill="#1f6feb" font-size="14">/indices</text></g>
        <g transform="translate(852)"><rect width="260" height="126" rx="17" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="25" y="39" fill="#17191d" font-size="21" font-weight="700">策略</text><text x="25" y="72" fill="#4b5563" font-size="16">规则、状态和机会</text><text x="25" y="101" fill="#1f6feb" font-size="14">/playbook</text></g>
      </g>
      <g transform="translate(0 322)">
        <rect width="538" height="82" rx="17" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="25" y="34" fill="#17191d" font-size="20" font-weight="700">辅助信息</text><text x="25" y="63" fill="#4b5563" font-size="16">公告 · 冲提 · 借贷</text>
        <rect x="574" width="538" height="82" rx="17" fill="#fff" stroke="#dfe3e8" stroke-width="2"/><text x="599" y="34" fill="#17191d" font-size="20" font-weight="700">账户与订阅</text><text x="599" y="63" fill="#4b5563" font-size="16">登录 · 权限 · 订阅 · 通知</text>
