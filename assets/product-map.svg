<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" role="img" aria-labelledby="title desc">
  <title id="title">51taoli 产品页面地图</title>
  <desc id="desc">用户从套利机会首页进入交易、资金费、指数、辅助情报、策略和账户页面的路径。</desc>
  <rect width="1240" height="660" rx="28" fill="#f2f4f5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="76" fill="#111318" font-size="34" font-weight="700">产品页面地图</text>
    <text x="64" y="112" fill="#6f7782" font-size="18">每个页面服务于一个研究问题；同名事实在不同页面不应改变口径。</text>
    <g transform="translate(64 160)">
      <rect width="1112" height="102" rx="18" fill="#15171c"/>
      <text x="34" y="41" fill="#fff" font-size="24" font-weight="700">首页 · 套利机会</text>
      <text x="34" y="73" fill="#dce3ed" font-size="17">从资产概览进入 FF / SF / FS 当前观察、详情与来源状态。</text>
      <rect x="897" y="27" width="180" height="46" rx="23" fill="#2864dc"/><text x="987" y="57" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">/opportunities</text>
    </g>
    <path d="M620 278v38" stroke="#a8b1bc" stroke-width="3"/><path d="M608 304l12 13 12-13" fill="none" stroke="#a8b1bc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(64 338)">
      <g><rect width="254" height="140" rx="16" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="25" y="38" fill="#111318" font-size="20" font-weight="700">交易 · 跨市场观察</text><text x="25" y="70" fill="#424850" font-size="15">类别、路线、交易所筛选</text><text x="25" y="97" fill="#424850" font-size="15">TradFi 产品目录与路线分开</text><text x="25" y="122" fill="#2864dc" font-size="14">/trade</text></g>
      <g transform="translate(286)"><rect width="254" height="140" rx="16" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="25" y="38" fill="#111318" font-size="20" font-weight="700">资金费</text><text x="25" y="70" fill="#424850" font-size="15">原始费率与原始周期</text><text x="25" y="97" fill="#424850" font-size="15">已结算历史与估算分开</text><text x="25" y="122" fill="#2864dc" font-size="14">/opportunities?tab=funding</text></g>
      <g transform="translate(572)"><rect width="254" height="140" rx="16" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="25" y="38" fill="#111318" font-size="20" font-weight="700">指数观察</text><text x="25" y="70" fill="#424850" font-size="15">指数、标记价、资金费</text><text x="25" y="97" fill="#424850" font-size="15">当前事实与闭合历史分开</text><text x="25" y="122" fill="#2864dc" font-size="14">/indices</text></g>
      <g transform="translate(858)"><rect width="254" height="140" rx="16" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="25" y="38" fill="#111318" font-size="20" font-weight="700">策略</text><text x="25" y="70" fill="#424850" font-size="15">版本、状态、短规则</text><text x="25" y="97" fill="#424850" font-size="15">真实机会与历史摘要</text><text x="25" y="122" fill="#2864dc" font-size="14">/playbook</text></g>
    </g>
    <g transform="translate(64 510)">
      <rect width="538" height="94" rx="16" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="25" y="37" fill="#111318" font-size="20" font-weight="700">辅助情报</text><text x="25" y="66" fill="#424850" font-size="15">公告 · 冲提 · 借贷：只展示有独立官方能力与来源状态的事实。</text>
      <rect x="574" width="538" height="94" rx="16" fill="#fff" stroke="#dde1e4" stroke-width="2"/><text x="599" y="37" fill="#111318" font-size="20" font-weight="700">账户与订阅</text><text x="599" y="66" fill="#424850" font-size="15">登录、授权记录、策略订阅与通知渠道按权限单独管理。</text>
