<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" role="img" aria-labelledby="title desc">
  <title id="title">51taoli 官网页面地图</title>
  <desc id="desc">从套利机会进入交易、资金费、指数、辅助信息、策略和账户页面。</desc>
  <rect width="1240" height="610" rx="28" fill="#f6f7f9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="76" fill="#17191d" font-size="34" font-weight="700">官网从哪里看起？</text>
    <text x="64" y="112" fill="#667085" font-size="18">从“套利机会”进入，再按问题打开相应页面。</text>
    <g transform="translate(64 156)">
      <rect width="1112" height="94" rx="18" fill="#17191d"/>
