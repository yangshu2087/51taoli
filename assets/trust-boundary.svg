<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-labelledby="title desc">
  <title id="title">51taoli 的数据边界</title>
  <desc id="desc">市场事实、可进一步验证的执行条件，以及平台绝不猜测填补的未知信息分别处理。</desc>
  <rect width="1240" height="480" rx="28" fill="#f2f4f5"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="75" fill="#111318" font-size="34" font-weight="700">把“看到的”与“能证明的”分开</text>
    <text x="64" y="110" fill="#6f7782" font-size="18">同一个数字是否能进入结论，取决于来源、身份、方向、时间和所需执行证据。</text>
    <g transform="translate(64 158)">
      <g><rect width="338" height="224" rx="20" fill="#fff" stroke="#dde1e4" stroke-width="2"/><rect width="338" height="54" rx="20" fill="#eaf2ff"/><text x="28" y="35" fill="#2864dc" font-size="21" font-weight="700">可以作为市场事实</text><text x="28" y="94" fill="#424850" font-size="16">• 官方 BBO、资金费、指数、目录</text><text x="28" y="126" fill="#424850" font-size="16">• 各字段自己的来源与观测时间</text><text x="28" y="158" fill="#424850" font-size="16">• 已核验范围内的辅助情报</text><text x="28" y="197" fill="#07966c" font-size="15" font-weight="600">先看事实，后谈结论</text></g>
      <g transform="translate(387)"><rect width="338" height="224" rx="20" fill="#fff" stroke="#dde1e4" stroke-width="2"/><rect width="338" height="54" rx="20" fill="#fff5df"/><text x="28" y="35" fill="#a46b0b" font-size="21" font-weight="700">需要更多执行证据</text><text x="28" y="94" fill="#424850" font-size="16">• 指定金额下的盘口深度</text><text x="28" y="126" fill="#424850" font-size="16">• 实际费率、滑点、退出与借币</text><text x="28" y="158" fill="#424850" font-size="16">• 账户级额度与产品规则</text><text x="28" y="197" fill="#a46b0b" font-size="15" font-weight="600">没有证据，不升级为净收益</text></g>
      <g transform="translate(774)"><rect width="338" height="224" rx="20" fill="#fff" stroke="#dde1e4" stroke-width="2"/><rect width="338" height="54" rx="20" fill="#fff0f1"/><text x="28" y="35" fill="#df4f5f" font-size="21" font-weight="700">绝不猜测或伪造</text><text x="28" y="94" fill="#424850" font-size="16">• 用 0、旧值或中间价补缺失</text><text x="28" y="126" fill="#424850" font-size="16">• 按 ticker 或价格近似配对资产</text><text x="28" y="158" fill="#424850" font-size="16">• 插值、回填或虚构历史路线</text><text x="28" y="197" fill="#df4f5f" font-size="15" font-weight="600">正确结果是「暂无 / 未知」</text></g>
    </g>
  </g>
</svg>
