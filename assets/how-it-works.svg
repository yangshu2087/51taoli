<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" role="img" aria-labelledby="title desc">
  <title id="title">51taoli 的研究路径</title>
  <desc id="desc">从选择路线、看清两条腿、补充市场信息到继续研究的四步路径。</desc>
  <rect width="1240" height="500" rx="28" fill="#f6f7f9"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="76" fill="#17191d" font-size="34" font-weight="700">一条路线，先看什么？</text>
    <text x="64" y="112" fill="#667085" font-size="18">从看到跨市场差异，到决定下一步该核对什么。</text>
    <g transform="translate(64 164)">
      <g>
        <rect width="240" height="220" rx="18" fill="#fff" stroke="#dfe3e8" stroke-width="2"/>
        <circle cx="38" cy="40" r="19" fill="#1f6feb"/><text x="38" y="47" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">1</text>
        <text x="28" y="94" fill="#17191d" font-size="23" font-weight="700">选择路线</text>
        <text x="28" y="128" fill="#4b5563" font-size="17">FF · SF · FS</text>
        <text x="28" y="158" fill="#4b5563" font-size="17">按资产和交易所筛选</text>
        <rect x="28" y="180" width="126" height="24" rx="12" fill="#eaf2ff"/><text x="41" y="197" fill="#1f6feb" font-size="13" font-weight="700">从机会页开始</text>
      </g>
      <path d="M258 110h46" stroke="#a9b3be" stroke-width="3" stroke-linecap="round"/><path d="M292 98l13 12-13 12" fill="none" stroke="#a9b3be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(322)">
        <rect width="240" height="220" rx="18" fill="#fff" stroke="#dfe3e8" stroke-width="2"/>
        <circle cx="38" cy="40" r="19" fill="#17191d"/><text x="38" y="47" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">2</text>
        <text x="28" y="94" fill="#17191d" font-size="23" font-weight="700">看清两条腿</text>
        <text x="28" y="128" fill="#4b5563" font-size="17">多哪边？空哪边？</text>
        <text x="28" y="158" fill="#4b5563" font-size="17">报价方向是否正确？</text>
        <rect x="28" y="180" width="126" height="24" rx="12" fill="#eef8f5"/><text x="41" y="197" fill="#078567" font-size="13" font-weight="700">看 ask / bid</text>
      </g>
      <path d="M580 110h46" stroke="#a9b3be" stroke-width="3" stroke-linecap="round"/><path d="M614 98l13 12-13 12" fill="none" stroke="#a9b3be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(644)">
        <rect width="240" height="220" rx="18" fill="#fff" stroke="#dfe3e8" stroke-width="2"/>
        <circle cx="38" cy="40" r="19" fill="#00a884"/><text x="38" y="47" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">3</text>
        <text x="28" y="94" fill="#17191d" font-size="23" font-weight="700">补充市场信息</text>
        <text x="28" y="128" fill="#4b5563" font-size="17">资金费 · 指数 · 公告</text>
        <text x="28" y="158" fill="#4b5563" font-size="17">冲提 · 借贷 · 产品信息</text>
        <rect x="28" y="180" width="140" height="24" rx="12" fill="#e9faf4"/><text x="41" y="197" fill="#078567" font-size="13" font-weight="700">进入对应页面</text>
      </g>
      <path d="M902 110h46" stroke="#a9b3be" stroke-width="3" stroke-linecap="round"/><path d="M936 98l13 12-13 12" fill="none" stroke="#a9b3be" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="translate(966)">
        <rect width="146" height="220" rx="18" fill="#17191d"/>
        <text x="73" y="84" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">继续研究</text>
        <text x="73" y="120" text-anchor="middle" fill="#d8dee8" font-size="15">打开详情</text>
        <text x="73" y="150" text-anchor="middle" fill="#d8dee8" font-size="15">查看策略</text>
        <text x="73" y="180" text-anchor="middle" fill="#d8dee8" font-size="15">提出问题</text>
      </g>
    </g>
  </g>
</svg>
